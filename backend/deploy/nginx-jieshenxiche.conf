# 洁神洗车 · Nginx 反向代理示例
# 放到 /etc/nginx/conf.d/jieshenxiche.conf，改成你的域名和证书路径后 nginx -t && nginx -s reload
#
# 作用：把 https://你的域名/ 全部转给本机 8099 的 Node 服务，
#       小程序正式上线必须用 https 域名（request/uploadFile 合法域名）。

server {
    listen 80;
    server_name wash.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wash.example.com;

    ssl_certificate     /etc/letsencrypt/live/wash.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wash.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 后台上传项目封面（后端限制 5MB，这里放宽一点）
    client_max_body_size 12m;

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8099/health;
        access_log off;
    }

    # 项目图片
    location /uploads/ {
        proxy_pass http://127.0.0.1:8099/uploads/;
        expires 7d;
    }

    # Web 后台管理系统
    location /admin/ {
        proxy_pass http://127.0.0.1:8099/admin/;
        proxy_set_header Host $host;
    }

    location = /admin {
        return 301 /admin/;
    }

    location / {
        return 404;
    }
}
