# 云托管 https 入口：把小程序请求转发到已有 Node 后端
# 平台会给本容器一个 https 域名（*.run.tcloudbase.com / *.app.tcloudbase.com），
# 该域名加到小程序「request 合法域名 / uploadFile 合法域名」即可。
server {
    listen 80;
    server_name _;

    # 拍照识别 / 项目封面最大 8MB，这里放宽
    client_max_body_size 20m;

    # 平台健康检查（容器自身 200，不依赖后端）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # 全部请求透传给后端：/api/* /admin/* /uploads/* /health
    location / {
        proxy_pass http://27.124.46.63:8099;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 8s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 后端 502/504 时给一句人话，方便排查
        proxy_intercept_errors off;
    }
}
